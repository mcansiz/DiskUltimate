# Live ISO (ADR 0101): Debian 13 tabani + uygulama katmani (AppImage).
#
# Iki katman, iki hiz:
#   1. Taban (Debian + X + jwm + pcmanfm, ~10-15 dk): GitHub onbelleginde
#      durur. Yalnizca tools/live/base/** degisince, haftalik guvenlik
#      tazelemesinde ya da elle istenince yeniden kurulur.
#   2. Uygulama katmani (AppImage, saniyeler): her kosuda tabana eklenir
#      (tools/live/remaster.py, root gerekmez).
#
# Onbellek kapsami: etiket (release) kosulari ana daldaki onbellegi okuyabilir;
# bu yuzden taban main uzerinde (push / schedule / elle) tazelenir.
#
# Release (workflow_call) disinda ISO yalnizca kosunun "artifacts" bolumune
# konur; release olusturulmaz.
name: Live ISO

on:
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: Tabani onbellekten almayip yeniden kur
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1"          # pazartesi: taban guvenlik guncellemeleriyle tazelenir
  push:
    branches: [main]
    paths:
      - "tools/live/**"
      - ".github/workflows/live-iso.yml"
  workflow_call:
    inputs:
      version:
        description: Uygulama surumu (release.yml version isi)
        required: true
        type: string
      appimage-artifact:
        description: AppImage'i tasiyan artifact (release.yml build-linux)
        required: false
        type: string
        default: dist-linux

permissions:
  contents: read

concurrency:
  group: live-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  iso:
    name: Live ISO (taban + AppImage + acilis denemesi)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false

      - name: Surum ve onbellek anahtari
        id: meta
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          [ -n "$ver" ] || ver=$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' src/diskultimate/ui/main_window.py)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # Hafta numarasi: taban en fazla bir hafta eski kalir.
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "Surum: $ver"

      - name: Taban (onbellek)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/live/base
          key: live-base-${{ hashFiles('tools/live/base/**') }}-${{ steps.meta.outputs.week }}
          restore-keys: |
            live-base-${{ hashFiles('tools/live/base/**') }}-

      - name: Taban kurulsun mu
        id: decide
        shell: bash
        run: |
          build=false
          if [ ! -f .tmp/live/base/base.iso ]; then
            build=true; why="onbellekte yok (ilk kosu ya da tools/live/base degisti)"
          elif [ "${{ inputs.rebuild_base }}" = "true" ]; then
            build=true; why="elle istendi"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            build=true; why="haftalik tazeleme"
          else
            why="onbellekteki taban kullaniliyor (${{ steps.cache.outputs.cache-matched-key }})"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Taban: $why" >> "$GITHUB_STEP_SUMMARY"
          echo "$why"

      - name: Taban kurulumu (debian:trixie kapsayicisinda live-build)
        if: steps.decide.outputs.build == 'true'
        timeout-minutes: 50
        run: |
          rm -rf .tmp/live/base && mkdir -p .tmp/live/base
          docker run --rm --privileged \
            -v "$PWD/tools/live/base:/cfg:ro" \
            -v "$PWD/.tmp/live/base:/out" \
            debian:trixie bash /cfg/build.sh /out
          ls -l .tmp/live/base

      - name: Tabani onbellege yaz
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/live/base
          key: live-base-${{ hashFiles('tools/live/base/**') }}-${{ steps.meta.outputs.week }}

      # --- Uygulama: release'te derlenmis AppImage, degilse bu commit'ten ---
      - name: AppImage (release artifact)
        if: inputs.version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.appimage-artifact }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.version == ''
        with: { python-version: "3.12" }
      - name: AppImage (bu commit'ten)
        if: inputs.version == ''
        run: ./build_appimage.sh

      - name: Araclar (xorriso, squashfs, QEMU, OVMF) + KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xorriso squashfs-tools qemu-system-x86 ovmf initramfs-tools-core
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Uygulama katmani + ISO
        shell: bash
        run: |
          ver="${{ steps.meta.outputs.version }}"
          iso="dist/DiskUltimate-$ver-live-amd64.iso"
          python3 tools/live/remaster.py .tmp/live/base/base.iso \
            "dist/DiskUltimate-$ver-x86_64.AppImage" "$ver" "$iso"
          cp .tmp/live/base/base.packages "dist/DiskUltimate-$ver-live-amd64.packages.txt"
          ls -l dist
          echo "### ISO: $(du -m "$iso" | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"

      # Boyut nereden geliyor: ISO'daki buyuk dosyalar ve initrd'ye giren
      # bellenim (initramfs-tools surucu bellenimini de kopyalar).
      - name: ISO icerigi (boyut)
        continue-on-error: true
        shell: bash
        run: |
          iso=$(ls dist/DiskUltimate-*-live-amd64.iso)
          xorriso -indev "$iso" -find / -type f -size +1m -exec lsdl 2>/dev/null \
            | awk '{printf "%8.1f MB  %s\n", $5/1048576, $NF}' | sort -rn | head -15
          mkdir -p .tmp/live/initrd
          xorriso -osirrox on -indev "$iso" -extract /live .tmp/live/initrd/live >/dev/null 2>&1
          rd=$(ls .tmp/live/initrd/live/initrd.img-* | head -n1)
          unmkinitramfs "$rd" .tmp/live/initrd/x
          echo "initrd: $(du -m "$rd" | cut -f1) MB (sikistirilmis), acik: $(du -sm .tmp/live/initrd/x | cut -f1) MB"
          du -sm .tmp/live/initrd/x/*/usr/lib/firmware/* .tmp/live/initrd/x/usr/lib/firmware/* 2>/dev/null | sort -rn | head -15
          du -sm .tmp/live/initrd/x/*/usr/lib/modules/*/kernel/drivers/* 2>/dev/null | sort -rn | head -8
          rm -rf .tmp/live/initrd

      - name: Acilis denemesi (BIOS)
        run: python3 tools/live/boot_check.py dist/DiskUltimate-*-live-amd64.iso --mode bios
      - name: Acilis denemesi (UEFI)
        run: python3 tools/live/boot_check.py dist/DiskUltimate-*-live-amd64.iso --mode uefi
      # Secure Boot ilk bes kosuda gecti (ADR 0101); artik sarttir.
      - name: Acilis denemesi (UEFI + Secure Boot)
        run: python3 tools/live/boot_check.py dist/DiskUltimate-*-live-amd64.iso --mode uefi-sb

      - name: Ekran goruntuleri ve gunlukler
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-check
          path: |
            .tmp/live/check/*.png
            .tmp/live/check/*.log
            .tmp/live/base/build.log
          if-no-files-found: ignore
          retention-days: 14

      # Deneme kosusunda acilis denemesi dusse de ISO yuklenir (teshis icin).
      - name: ISO (deneme kosusu)
        if: ${{ !cancelled() && inputs.version == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-iso
          path: |
            dist/DiskUltimate-*-live-amd64.iso
            dist/DiskUltimate-*-live-amd64.packages.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: ISO (release)
        if: inputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-live
          path: |
            dist/DiskUltimate-*-live-amd64.iso
            dist/DiskUltimate-*-live-amd64.packages.txt
          if-no-files-found: error
          compression-level: 0
