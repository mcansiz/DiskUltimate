# Surum: `v*` etiketi push edilince test + uc platform derlemesi + TASLAK
# release. Taslagi bir insan inceleyip yayinlar (ADR 0079).
# Elle calistirma (workflow_dispatch) = deneme: her sey derlenir, dosyalar
# calistirmanin "artifacts" bolumune konur, release olusturulmaz.
# `qt` girdisi (ADR 0102): etiket surumleri PyQt6 (girdi bos -> pyqt6);
# elle calistirmada PyQt5 ile deneme derlemesi secilebilir.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      qt:
        description: Qt baglamasi (deneme derlemesi)
        type: choice
        options: [pyqt6, pyqt5]
        default: pyqt6

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  DISKULTIMATE_QT: ${{ inputs.qt || 'pyqt6' }}

jobs:
  version:
    name: Surum denetimi
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/diskultimate/ui/main_window.py
          sparse-checkout-cone-mode: false
      - id: v
        shell: bash
        run: |
          ver=$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' src/diskultimate/ui/main_window.py)
          echo "APP_VERSION=$ver"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) koddaki surumle (v$ver) ayni degil"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: ubuntu-24.04, qt: "${{ inputs.qt || 'pyqt6' }}" }
  test-windows:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: windows-2022, qt: "${{ inputs.qt || 'pyqt6' }}" }
  test-macos:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: macos-14, qt: "${{ inputs.qt || 'pyqt6' }}" }

  build-linux:
    name: Derleme (Linux AppImage)
    needs: [version, test-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Qt calisma kutuphaneleri (deneme acilisi icin)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends binutils \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: AppImage
        run: ./build_appimage.sh
      - name: Deneme acilisi
        run: python tools/smoke_launch.py --qt "${{ env.DISKULTIMATE_QT }}" "${{ needs.version.outputs.version }}" "dist/DiskUltimate-${{ needs.version.outputs.version }}-x86_64.AppImage" --appimage-extract-and-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: dist/DiskUltimate-${{ needs.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Derleme (Windows exe)
    needs: [version, test-windows]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: PyQt + PyInstaller
        shell: bash
        run: |
          req=.github/requirements-build.txt
          [ "$DISKULTIMATE_QT" = pyqt6 ] && req=.github/requirements-build-qt6.txt
          python -m pip install --disable-pip-version-check -r "$req"
      - name: Exe
        shell: bash
        run: |
          python -m PyInstaller DiskUltimate.spec --noconfirm --clean
          mv dist/DiskUltimate.exe "dist/DiskUltimate-${{ needs.version.outputs.version }}-windows-x64.exe"
          ls -l dist/*.exe
      - name: Deneme acilisi
        run: python tools/smoke_launch.py --qt "${{ env.DISKULTIMATE_QT }}" "${{ needs.version.outputs.version }}" "dist/DiskUltimate-${{ needs.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/DiskUltimate-${{ needs.version.outputs.version }}-windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: Derleme (macOS, deneysel)
    needs: [version, test-macos]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: PyQt + PyInstaller
        shell: bash
        run: |
          req=.github/requirements-build.txt
          [ "$DISKULTIMATE_QT" = pyqt6 ] && req=.github/requirements-build-qt6.txt
          python -m pip install --disable-pip-version-check -r "$req"
      - name: .app
        run: |
          python -m PyInstaller DiskUltimate.spec --noconfirm --clean
          ditto -c -k --keepParent dist/DiskUltimate.app "dist/DiskUltimate-${{ needs.version.outputs.version }}-macos-arm64.zip"
      # Gercek alt surum: ikililerin LC_BUILD_VERSION minos degeri (ADR 0102).
      - name: macOS alt surum olcumu
        run: |
          ls -l dist/*.zip
          find dist/DiskUltimate.app -type f \( -name 'QtCore' -o -name 'QtCore.abi3.so' -o -name 'QtWidgets' -o -name 'DiskUltimate' \) | while read f; do
            printf '%s: ' "${f#dist/}"; otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; b=0; exit}'
          done
      - name: Deneme acilisi
        run: python tools/smoke_launch.py --qt "${{ env.DISKULTIMATE_QT }}" "${{ needs.version.outputs.version }}" dist/DiskUltimate.app/Contents/MacOS/DiskUltimate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist/DiskUltimate-${{ needs.version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  # Live ISO (ADR 0101): Linux AppImage'i onbellekteki Debian tabanina ekler
  # ve BIOS / UEFI / UEFI + Secure Boot acilisini sinar. Sarttir.
  build-live:
    name: Derleme (Live ISO)
    needs: [version, build-linux]
    uses: ./.github/workflows/live-iso.yml
    with:
      version: ${{ needs.version.outputs.version }}
      appimage-artifact: dist-linux

  release:
    name: Taslak release
    # macOS deneyseldir: testi ya da derlemesi duserse release yine olusur,
    # yalnizca o dosya eklenmez. Windows, Linux ve live ISO sarttir.
    needs: [version, build-linux, build-windows, build-macos, build-live]
    if: >-
      always() && github.ref_type == 'tag'
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-live.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - name: Taslak release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
          MACOS: ${{ needs.build-macos.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          cd out
          sha256sum DiskUltimate-* > SHA256SUMS
          cat SHA256SUMS
          if [ "$MACOS" = "success" ]; then
            row="| **macOS 11+ (Apple Silicon), experimental** | \`DiskUltimate-$VER-macos-arm64.zip\` | Not tested beyond automated tests; macOS is not officially supported. Unsigned: right-click the app → **Open** the first time. |"
            tr="- **macOS (deneysel):** \`DiskUltimate-$VER-macos-arm64.zip\` — yalnızca otomatik testlerden geçti, resmi olarak desteklenmiyor. İmzasız: ilk açılışta sağ tık → **Aç**."
          else
            row=""; tr=""
          fi
          python3 - "$VER" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$RUN_URL" "$row" "$tr" <<'PY'
          import sys
          ver, tag, repo, run, row, tr = sys.argv[1:7]
          text = open("../.github/release-notes.md", encoding="utf-8").read()
          for key, value in (("{VERSION}", ver), ("{TAG}", tag), ("{REPO}", repo),
                             ("{RUN_URL}", run), ("{MACOS_ROW}", row), ("{MACOS_TR}", tr)):
              text = text.replace(key, value)
          open("notes.md", "w", encoding="utf-8").write(text)
          PY
          pre=""
          case "$VER" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release zaten var: dosyalar guncelleniyor"
            gh release upload "$GITHUB_REF_NAME" DiskUltimate-* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" DiskUltimate-* SHA256SUMS \
              --draft $pre --title "DiskUltimate $VER" --notes-file notes.md
          fi
