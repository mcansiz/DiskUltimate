# Her push'ta Linux testleri: hatalar surum gunu degil hemen yakalanir.
# Yalnizca oturum dokumu / belge degisen commit'ler testi tetiklemez.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: [".claude/**", "**/*.md", "docs/**"]
  pull_request:
    paths-ignore: [".claude/**", "**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-24.04
