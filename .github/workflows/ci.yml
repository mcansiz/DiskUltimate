# Her push'ta Linux testleri: hatalar surum gunu degil hemen yakalanir.
# Yalnizca oturum dokumu / belge degisen commit'ler testi tetiklemez.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: [".claude/**", "**/*.md", "docs/**"]
  pull_request:
    paths-ignore: [".claude/**", "**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-24.04

  # Ana is PyQt6 ile kosar (tests.yml varsayilani, ADR 0102). Bu is PyQt5
  # uyumlulugunu korur: kaynaktan calistirilan eski sistemler (Python 3.8,
  # Alpine py3-qt5). Iki baglama da kurulur ki qt6_check her tam nitelikli
  # enum'u ikisinde de dogrulayabilsin.
  linux-qt5:
    name: PyQt5 uyumlulugu (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      DISKULTIMATE_NO_ELEVATION_PROMPT: "1"
      DISKULTIMATE_UPDATE_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt calisma kutuphaneleri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            dosfstools exfatprogs ntfs-3g e2fsprogs mtools gdisk
      - name: PyQt5 + PyQt6
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m pip install --disable-pip-version-check -r .github/requirements-ci-qt6.txt
      - name: PyQt5/PyQt6 ortak yazim denetimi
        run: python -m tests.qt6_check
      - name: Arayuz duman testi (PyQt5)
        env:
          QT_QPA_PLATFORM: offscreen
          DISKULTIMATE_QT: pyqt5
        run: python -m tests.ui_smoke
      - name: Hata durumunda ekran goruntuleri ve gunlukler
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-ciktilari-qt5
          path: |
            .tmp/screenshots/
            .claude/logs/
          if-no-files-found: ignore
          retention-days: 14
