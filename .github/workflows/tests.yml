# Ortak test isi: CI (her push) ve release (etiket) bunu cagirir.
# Yalnizca disk goruntusu dosyalariyla calisan testler; fiziksel disk testleri
# burada KOSMAZ (CLAUDE.md test ortami kurali, VM'de kalir).
name: Testler

on:
  workflow_call:
    inputs:
      os:
        description: Runner (ubuntu-24.04, windows-2022, macos-14)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Testler (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      DISKULTIMATE_NO_ELEVATION_PROMPT: "1"
      DISKULTIMATE_UPDATE_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Oturum dokumleri (~250 MB) testlere gerekmez.
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Linux araclari (capraz dogrulama + Qt calisma kutuphaneleri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            dosfstools exfatprogs ntfs-3g e2fsprogs xfsprogs btrfs-progs \
            f2fs-tools hfsprogs udftools zstd binutils \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: PyQt5
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Capraz platform denetimi
        run: python -m tests.platform_check
      - name: Ceviri sozlukleri
        run: python -m tests.i18n_check
      - name: Tanilama
        run: python -m tests.diag_check
      - name: Cekirdek testleri
        run: python -m tests.run_all
      - name: Arayuz duman testi
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.ui_smoke

      - name: Hata durumunda ekran goruntuleri ve gunlukler
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-ciktilari-${{ inputs.os }}
          path: |
            .tmp/screenshots/
            .claude/logs/
          if-no-files-found: ignore
          retention-days: 14
