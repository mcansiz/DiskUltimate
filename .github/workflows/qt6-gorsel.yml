# PyQt6 gecisi D asamasi (ADR 0102): ayni duman testi PyQt5 ve PyQt6 ile,
# farkli olceklerde (QT_SCALE_FACTOR) calisir; ekran goruntuleri (acik/koyu
# tema dahil) karsilastirma icin yuklenir. Elle baslatilir.
# Gercek platform eklentisi: ekransiz kipte (offscreen) PyQt5 12 pt / 100 DPI,
# PyQt6 9 pt / 96 DPI secer ve Windows'ta yazi tipi bulunmaz; karsilastirma
# anlamsizlasir (olculdu 2026-10-31). Linux xvfb + xcb, Windows windows,
# macOS offscreen (yazi tipleri orada dogru).
name: PyQt6 gorsel karsilastirma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gorsel:
    name: ${{ matrix.os }} ${{ matrix.qt }} x${{ matrix.olcek }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, qt: pyqt5, olcek: "1" }
          - { os: ubuntu-24.04, qt: pyqt5, olcek: "1.5" }
          - { os: ubuntu-24.04, qt: pyqt6, olcek: "1" }
          - { os: ubuntu-24.04, qt: pyqt6, olcek: "1.25" }
          - { os: ubuntu-24.04, qt: pyqt6, olcek: "1.5" }
          - { os: windows-2022, qt: pyqt5, olcek: "1" }
          - { os: windows-2022, qt: pyqt6, olcek: "1" }
          - { os: windows-2022, qt: pyqt6, olcek: "1.5" }
          - { os: macos-14, qt: pyqt5, olcek: "1" }
          - { os: macos-14, qt: pyqt6, olcek: "1" }
          - { os: macos-14, qt: pyqt6, olcek: "1.5" }
    env:
      PYTHONIOENCODING: utf-8
      DISKULTIMATE_NO_ELEVATION_PROMPT: "1"
      DISKULTIMATE_UPDATE_CHECK: "0"
      DISKULTIMATE_QT: ${{ matrix.qt }}
      QT_QPA_PLATFORM: ${{ startsWith(matrix.os, 'ubuntu') && 'xcb' || startsWith(matrix.os, 'windows') && 'windows' || 'offscreen' }}
      QT_SCALE_FACTOR: ${{ matrix.olcek }}
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.claude/sessions/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Linux Qt kutuphaneleri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-cursor0 fonts-dejavu-core \
            dosfstools exfatprogs ntfs-3g e2fsprogs mtools gdisk
      - name: PyQt
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          if [ "$DISKULTIMATE_QT" = pyqt6 ]; then
            python -m pip install --disable-pip-version-check -r .github/requirements-ci-qt6.txt
          fi
      - name: Duman testi
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" python -m tests.ui_smoke 2>&1 | tee smoke.log
          else
            python -m tests.ui_smoke 2>&1 | tee smoke.log
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gorsel-${{ matrix.os }}-${{ matrix.qt }}-x${{ matrix.olcek }}
          path: |
            .tmp/screenshots/
            smoke.log
          if-no-files-found: ignore
          retention-days: 14
