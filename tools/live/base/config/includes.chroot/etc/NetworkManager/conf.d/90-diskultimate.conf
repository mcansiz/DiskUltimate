# DiskUltimate live: NetworkManager (ADR 0101).
#
# Kablolu ag icin ayar gerekmez: NM her kablolu karta kendiliginden
# "Wired connection" acar (DHCP). Kablosuz ag nm-applet'ten secilir.
# 0.10.1-beta'ya kadar kablolu ag dhcpcd ile kuruluyordu; iki DHCP
# istemcisi ayni karti yonetmesin diye dhcpcd servisi kaldirildi.
[main]
# /etc/resolv.conf'u NM yazar (systemd-resolved yok).
dns=default
rc-manager=file

[connectivity]
# Ag denetimi icin disari istek gonderilmez.
enabled=false
