# live-build varsayilaninin ustune: zaman asimi (varsayilan sonsuz bekler; ISO
# kendiliginden acilmazdi, CI acilis denemesi de takilirdi).
set default=0
set timeout=10

# Yazi tipi tam yoluyla yuklenir. live-build varsayilani GRUB 2.12'de
# `loadfont unicode` dalina girer; o $prefix/fonts/unicode.pf2 arar, ISO'da
# dosya /boot/grub/unicode.pf2'dedir -> yukleme sessizce duser, GRUB
# yerlesik ASCII yazi tipine kalir ve menudeki "Türkçe", "—", Kiril/CJK
# kutu olarak cizilir (2026-10-25, gercek ekran goruntusu).
if loadfont $prefix/unicode.pf2 || loadfont unicode ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
