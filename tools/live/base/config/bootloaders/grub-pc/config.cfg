# live-build varsayilaninin ustune: zaman asimi (varsayilan sonsuz bekler; ISO
# kendiliginden acilmazdi, CI acilis denemesi de takilirdi).
set default=0
set timeout=10

# Yazi tipi tam yoluyla yuklenir. live-build varsayilani GRUB 2.12'de
# `loadfont unicode` dalina girer; o $prefix/fonts/unicode.pf2 arar, ISO'da
# dosya /boot/grub/unicode.pf2'dedir -> yukleme sessizce duser, GRUB
# yerlesik ASCII yazi tipine kalir ve menudeki "Türkçe", "—", Kiril/CJK
# kutu olarak cizilir (2026-10-25, gercek ekran goruntusu).
# GRUB betiginde `||` / `&&` YOK: `if loadfont a || loadfont b` sozdizimi
# hatasidir, GRUB tum `if` blogunu atlar ve hicbir yazi tipi yuklenmez
# (VirtualBox'ta GRUB konsolunda `lsfonts` bos cikti, 2026-10-25).
if loadfont $prefix/unicode.pf2 ; then
    set gfxmode=800x600,auto
    set gfxpayload=keep
else
    set gfxmode=auto
fi
# Tum goruntu suruculeri: live-build varsayilani yalnizca efi_gop/efi_uga/
# bochs/cirrus yukluyordu; BIOS'lu gercek makinenin (VESA, `vbe`) surucusu
# yoktu, GRUB metin kipine dusuyordu (VirtualBox BIOS'ta goruldu).
insmod all_video

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
