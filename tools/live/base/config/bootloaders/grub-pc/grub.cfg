# DiskUltimate live GRUB menusu (ADR 0101). @...@ yer tutuculari
# live-build binary_grub_cfg tarafindan doldurulur.

source /boot/grub/config.cfg

menuentry "DiskUltimate — English" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us diskultimate.lang=en
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Türkçe" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=tr_TR.UTF-8 keyboard-layouts=tr diskultimate.lang=tr
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Deutsch" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=de_DE.UTF-8 keyboard-layouts=de diskultimate.lang=de
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Français" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=fr_FR.UTF-8 keyboard-layouts=fr diskultimate.lang=fr
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Italiano" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=it_IT.UTF-8 keyboard-layouts=it diskultimate.lang=it
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Español" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=es_ES.UTF-8 keyboard-layouts=es diskultimate.lang=es
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — Русский" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=ru_RU.UTF-8 keyboard-layouts=us,ru diskultimate.lang=ru
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — 中文" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=zh_CN.UTF-8 keyboard-layouts=us diskultimate.lang=zh
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — 日本語" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=ja_JP.UTF-8 keyboard-layouts=jp diskultimate.lang=ja
	initrd	@INITRD_LIVE@
}
menuentry "DiskUltimate — 한국어" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=ko_KR.UTF-8 keyboard-layouts=kr diskultimate.lang=ko
	initrd	@INITRD_LIVE@
}

submenu 'Advanced / Gelişmiş ...' --hotkey=a {
	source /boot/grub/theme.cfg
	menuentry "DiskUltimate — English (load to RAM: toram)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram locales=en_US.UTF-8 keyboard-layouts=us diskultimate.lang=en
		initrd	@INITRD_LIVE@
	}
	menuentry "DiskUltimate — Türkçe (RAM'e yükle: toram)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram locales=tr_TR.UTF-8 keyboard-layouts=tr diskultimate.lang=tr
		initrd	@INITRD_LIVE@
	}
	menuentry "DiskUltimate — safe graphics (nomodeset)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset locales=en_US.UTF-8 keyboard-layouts=us diskultimate.lang=en
		initrd	@INITRD_LIVE@
	}
	menuentry "Live system (fail-safe mode)" {
		linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
		initrd	@INITRD_LIVE@
	}
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
